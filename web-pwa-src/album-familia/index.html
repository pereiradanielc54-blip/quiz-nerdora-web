  --green:#4f6342; --green2:#687a58; --ink:#183224; --muted:#75665b;

*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eadfcf;color:var(--ink)}
button,input,textarea{font:inherit} button{cursor:pointer}
.app-shell{min-height:100dvh;display:flex;justify-content:center;background:#d9cdbd}
.phone{position:relative;width:min(100vw,470px);min-height:100dvh;overflow:hidden;background-size:cover;background-position:center;padding:env(safe-area-inset-top) 18px calc(98px + env(safe-area-inset-bottom));}
.phone::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,248,236,.08),rgba(255,248,236,.05));pointer-events:none}
.screen-content{position:relative;z-index:2}
.status{height:42px;display:flex;align-items:center;justify-content:space-between;color:white;font-weight:750;text-shadow:0 1px 4px rgba(0,0,0,.12);padding:0 10px;font-size:15px}
.status-icons{letter-spacing:3px;font-size:13px}.header{display:flex;align-items:center;gap:12px;margin:12px 8px 16px}.header h1,.header h2,.title{margin:0;color:var(--ink);font-weight:800}.header h1{font-size:31px}.header .sub{color:var(--muted);font-size:15px;margin-top:2px}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.85);box-shadow:0 4px 18px rgba(0,0,0,.1)}
.header-actions{margin-left:auto;display:flex;gap:10px}.icon-btn,.round-btn{border:0;background:rgba(255,250,241,.9);color:#4f4338;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow)}
.round-btn.small{width:44px;height:44px;font-size:20px}.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.65);border-radius:var(--radius);box-shadow:var(--shadow)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 8px 10px;font-size:25px;font-weight:800}.section-title a{font-size:14px;font-weight:600;color:var(--muted)}
.hero{padding:18px;display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:center}.hero h2{font-size:31px;line-height:1.03;margin:10px 0 8px}.eyebrow{font-weight:800;font-size:18px;color:var(--green)}.meta{color:var(--muted);font-size:14px}.hero p{color:var(--muted);line-height:1.35;margin:0 0 12px}.hero-photo{width:100%;aspect-ratio:1/1.05;object-fit:cover;border-radius:22px;box-shadow:0 6px 20px rgba(77,54,34,.18)}
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:800}.btn.primary{background:var(--green);color:#fff;box-shadow:0 7px 18px rgba(54,77,47,.25)}.btn.outline{background:rgba(255,250,241,.86);border:2px solid var(--green);color:var(--green)}.btn.full{width:100%}.btn.soft{background:rgba(255,250,241,.92);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.stat{padding:12px 10px;display:flex;align-items:center;gap:9px}.stat .bubble{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sage)}.stat strong{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}
.memory-grid,.album-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.memory-card,.album-card{overflow:hidden}.memory-card img,.album-card img{width:100%;height:150px;object-fit:cover}.memory-card .body,.album-card .body{padding:10px 12px}.memory-card strong,.album-card strong{display:block}.small-muted{font-size:12px;color:var(--muted)}
.specials{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.special{padding:12px;border-radius:20px;background:rgba(255,250,241,.9);box-shadow:var(--shadow);font-size:12px}.special b{display:block;margin:4px 0}.special .round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--rose)}
.bottom-nav{position:absolute;z-index:8;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));height:78px;border-radius:30px;background:rgba(255,250,241,.95);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(61,45,31,.2);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:5px 8px}.nav-item{border:0;background:transparent;color:#68594e;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}.nav-item .ico{font-size:24px;line-height:1}.nav-item.active{color:var(--ink);font-weight:800;background:rgba(226,231,216,.75);border-radius:22px;padding:8px 0}.fab{position:absolute;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(62px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:5px solid rgba(255,250,241,.9);background:var(--green);color:#fff;font-size:39px;line-height:1;box-shadow:0 9px 22px rgba(61,78,52,.3)}
.search{display:flex;align-items:center;gap:12px;padding:14px 18px;margin-bottom:10px}.search input{border:0;outline:0;background:transparent;width:100%;font-size:17px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:0;border-radius:999px;padding:11px 15px;background:rgba(255,250,241,.92);color:#5c4f44;box-shadow:0 5px 14px rgba(78,55,36,.08)}.chip.active{background:var(--green);color:white}.album-card img{height:130px}.album-grid{margin-top:12px}
.diary-list{display:grid;gap:10px}.diary-entry{padding:14px;display:grid;grid-template-columns:62px 1fr 110px;gap:12px;align-items:center}.datebox{text-align:center;border-right:1px solid var(--line)}.datebox strong{font-size:28px}.datebox span{display:block;color:var(--muted);font-size:12px}.diary-entry h3{margin:0 0 5px;font-size:17px}.diary-entry p{margin:0;color:var(--muted);font-size:13px;line-height:1.28}.diary-entry img{width:110px;height:98px;object-fit:cover;border-radius:18px}.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.tag{padding:6px 9px;border-radius:999px;background:var(--rose);font-size:11px;color:#7d3a2b}.tag.alt{background:var(--gold);color:#7d5b18}.tag.purple{background:#eadcf2;color:#7d4c8d}
.form-card{padding:14px;display:grid;gap:12px}.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(248,238,223,.8);padding:5px;border-radius:20px}.segment button{border:0;background:transparent;border-radius:16px;padding:11px;color:#6b5747;font-weight:700}.segment button.active{background:var(--sage);color:var(--ink)}.upload{height:170px;border:2px dashed rgba(96,77,58,.18);border-radius:22px;display:grid;place-items:center;text-align:center;color:var(--muted);background:rgba(255,255,255,.3)}.field{background:rgba(255,255,255,.35);border-radius:18px;padding:12px}.field label{display:block;font-weight:800;margin-bottom:8px}.field input,.field textarea{width:100%;border:1px solid rgba(93,72,51,.14);background:rgba(255,255,255,.46);border-radius:14px;padding:13px;outline:0;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.row-option{display:flex;align-items:center;gap:12px;padding:14px}.row-option .left-icon{width:40px;height:40px;border-radius:50%;background:var(--gold);display:grid;place-items:center}.row-option .grow{flex:1}.toggle{width:54px;height:30px;border-radius:999px;background:#bfc8b6;padding:3px}.toggle.on{background:var(--green)}.toggle i{display:block;width:24px;height:24px;background:white;border-radius:50%;margin-left:0;transition:.2s}.toggle.on i{margin-left:24px}

.detail-card{overflow:hidden;padding-bottom:14px}.detail-photo-wrap{position:relative}.detail-photo{width:100%;height:360px;object-fit:cover}.detail-card .text{padding:16px}.detail-card h2{font-size:29px;margin:0 0 7px}.detail-card p{color:#6f6054;line-height:1.45}.action-row{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin:12px 0}.action-pill{border:0;border-radius:999px;background:#f4ede3;padding:11px}.comment{display:flex;gap:10px;padding:11px;border-radius:18px;background:rgba(255,255,255,.42);margin-top:8px}.comment img{width:42px;height:42px;border-radius:50%;object-fit:cover}.comment p{font-size:13px;margin:3px 0}.comment-input{display:flex;gap:8px;align-items:center;margin-top:9px}.comment-input input{flex:1;border:0;border-radius:999px;background:rgba(255,255,255,.55);padding:12px 15px}
.onboarding{padding-bottom:18px;display:flex;flex-direction:column;min-height:calc(100dvh - 42px)}.onboarding-center{margin:auto 0}.brand-icon{width:118px;height:118px;border-radius:32px;background:rgba(255,250,241,.88);box-shadow:var(--shadow);display:grid;place-items:center;margin:0 auto 20px}.brand-icon img{width:76px;height:76px}.onboarding h1{text-align:center;font-size:39px;margin:0;color:var(--ink)}.onboarding .lead{text-align:center;color:var(--muted);font-size:20px;line-height:1.3;max-width:330px;margin:14px auto 28px}.onboarding .actions{display:grid;gap:14px;max-width:330px;margin:0 auto;width:100%}.link-btn{border:0;background:transparent;color:var(--green);font-weight:700;text-decoration:underline}.login-panel{max-width:360px;margin:0 auto;padding:18px;display:grid;gap:12px}.login-panel .field{background:rgba(255,250,241,.9)}.info-note{padding:13px;display:flex;gap:12px;align-items:flex-start}.family-entry{max-width:390px;margin:20px auto 0;display:grid;gap:12px}.choice{padding:18px;display:flex;gap:14px;align-items:center}.choice .circle{width:58px;height:58px;border-radius:50%;background:var(--rose);display:grid;place-items:center;font-size:27px}.choice:nth-child(2) .circle{background:var(--sage)}.choice .grow{flex:1}.choice h3{margin:0 0 4px;font-size:21px}.choice p{margin:0;color:var(--muted);font-size:14px}.back{position:absolute;z-index:5;top:58px;left:20px}
.invite-card{padding:16px}.invite-code{display:flex;gap:8px;margin-top:10px}.invite-code input{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.6)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#1d2d22;color:white;padding:11px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}

function invites(){app.innerHTML=shell(bg.invites,`<button class="round-btn back" data-go="family">‹</button><div style="padding-top:58px"><div class="header" style="margin-left:64px"><div><h1>Convites e membros</h1><div class="sub">Gerencie quem participa da família.</div></div></div><div class="card invite-card"><h2 style="margin-top:0">Convide alguém</h2><p class="small-muted">Compartilhe este link. Quem aceitar poderá entrar no mesmo álbum da família.</p><div class="invite-code"><input id="familyLink" readonly value="https://albumfamilia.app/join/${state.family.invite}"><button class="btn primary" id="copyInvite">Copiar</button></div><button class="btn outline full" id="shareInvite" style="margin-top:10px">Compartilhar link</button></div><div class="section-title"><span>Membros</span><a>5 pessoas</a></div><div class="settings-list">${['Carlos — Administrador','Mariana — Administrador','Sofia — Membro','Lucas — Membro','Vovó Ana — Membro'].map((x,i)=>`<div class="card setting"><div class="si">${i<2?'♛':'○'}</div><div class="grow"><b>${x.split(' — ')[0]}</b><small>${x.split(' — ')[1]}</small></div><span>›</span></div>`).join('')}</div></div>`);

 $('#shareInvite').onclick=async()=>{const url=$('#familyLink').value;if(navigator.share){try{await navigator.share({title:'Álbum de família',text:'Entre no nosso álbum da família',url})}catch{}}else showToast('Use o botão Copiar')};
}

function memoryDetail(id){const x=state.memories.find(m=>String(m.id)===String(id))||state.memories[0];app.innerHTML=shell(bg.detail,`<div class="header"><button class="round-btn small" data-go="album">‹</button><div><h1>Lembrança</h1></div><div class="header-actions"><button class="icon-btn">⋯</button></div></div><article class="card detail-card"><div class="detail-photo-wrap"><img class="detail-photo" src="${x.image}" alt="${x.title}"><span class="chip" style="position:absolute;top:14px;right:14px">1/12</span></div><div class="text"><h2>${x.title}</h2><div class="meta">▤ ${x.date}</div><p>${x.desc}</p><div class="tags"><span class="tag">♧ Com a Mamãe</span><span class="tag alt">▣ Álbum: ${x.album}</span></div><div class="action-row"><button class="action-pill">♥ 12</button><button class="action-pill">◯ 4</button><button class="action-pill">↗ Compartilhar</button></div><div class="section-title" style="margin-left:0;margin-right:0"><span style="font-size:22px">Comentários</span><a>Ver todos (4) ›</a></div><div class="comment"><img src="${bg.family}"><div><b>Papai</b><p>Que foto linda! Esse dia foi muito especial!</p><span class="small-muted">8 de abr.</span></div></div><div class="comment"><img src="${bg.profile}"><div><b>Vovó Lúcia</b><p>Lindas! Amo ver essa conexão de vocês 🥰</p><span class="small-muted">9 de abr.</span></div></div><div class="comment-input"><input id="commentText" placeholder="Escreva um comentário..."><button class="round-btn small" id="sendComment">➤</button></div></div></article>`,nav('album'));$('#sendComment').onclick=()=>{if($('#commentText').value.trim()){showToast('Comentário publicado');$('#commentText').value=''}}}

const routes={splash,login,familyEntry,home,album,albumDetail,diary,create:createMemory,family,invites,profile};
function go(route){history.replaceState(null,'','#'+route);(routes[route]||home)();bindGlobal()}
function bindGlobal(){document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));document.querySelectorAll('[data-memory]').forEach(el=>el.onclick=()=>{history.replaceState(null,'','#memory-'+el.dataset.memory);memoryDetail(el.dataset.memory);bindGlobal()});wireInstallButtons()}
function wireInstallButtons(){document.querySelectorAll('#installApp,#installAppProfile').forEach(btn=>{if(deferredInstallPrompt){btn.hidden=false;btn.onclick=async()=>{deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;wireInstallButtons()}}else if(window.matchMedia('(display-mode: standalone)').matches){btn.hidden=true}else{btn.hidden=false;btn.onclick=()=>showToast('No Chrome: menu ⋮ > Adicionar à tela inicial')}})}
window.addEventListener('hashchange',()=>boot());
function boot(){const h=location.hash.slice(1);if(h.startsWith('memory-')){memoryDetail(h.split('-')[1]);bindGlobal();return}if(h&&routes[h]){routes[h]();bindGlobal();return}if(!state.logged)splash();else if(!state.familyCreated)familyEntry();else home();bindGlobal()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;wireInstallButtons()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;showToast('Aplicativo instalado')});
