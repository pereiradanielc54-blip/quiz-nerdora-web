<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Nerdora Terra — explore a Terra real em um globo 3D interativo.">
  <title>Nerdora Terra v0.2</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app-shell">
    <section class="main-screen" aria-label="Tela principal do Nerdora Terra">
      <div class="earth-window" id="earthWindow">
        <div id="earthMap" aria-label="Globo 3D interativo da Terra"></div>
        <div class="space-vignette"></div>
        <div class="earth-loading" id="earthLoading"><span></span><b>Carregando Terra real...</b></div>
        <div class="data-credit">NASA GIBS • MapLibre</div>
      </div>

      <img class="ui-overlay" src="ui-overlay.webp" alt="" draggable="false">

      <button class="hit hit-sound" data-action="sound" aria-label="Som"></button>
      <button class="hit hit-fullscreen" data-action="fullscreen" aria-label="Tela cheia"></button>
      <button class="hit hit-explore" data-action="explore" aria-label="Explorar agora"></button>
      <button class="hit hit-random" data-action="random" aria-label="Me surpreenda"></button>
      <button class="hit hit-nature" data-action="nature" aria-label="Natureza"></button>
      <button class="hit hit-ocean" data-action="ocean" aria-label="Oceanos"></button>
      <button class="hit hit-terra" data-action="terra" aria-label="Terra"></button>
      <button class="hit hit-discover" data-action="discover" aria-label="Descobrir"></button>
      <button class="hit hit-time" data-action="time" aria-label="Tempo"></button>
      <button class="hit hit-universe" data-action="universe" aria-label="Universe"></button>
    </section>

    <aside class="info-panel" id="infoPanel" aria-hidden="true">
      <button class="info-close" id="infoClose" aria-label="Fechar">×</button>
      <div class="info-kicker" id="infoKicker">NERDORA TERRA</div>
      <div class="info-icon" id="infoIcon">🌍</div>
      <h2 id="infoTitle">Terra</h2>
      <p id="infoText"></p>
      <div class="info-stats" id="infoStats"></div>
      <button class="focus-button" id="focusButton">Localizar no globo</button>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
